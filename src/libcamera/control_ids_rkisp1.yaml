# RkISP1 specific control definitions
---
# Unless otherwise stated, all controls are bi-directional, i.e. they can be
# set through Request::controls() and returned out through Request::metadata().
vendor: rkisp1
controls:
  # --- RkISP1 DPF controls ---
  - DpfEnable:
      type: bool
      direction: inout
      description: |
        Enable or disable the Denoise Pre-Filter (DPF) block.

        When disabled (false) the hardware DPF is forced off regardless of
        tuning or ISO level selection. When enabled (true) the algorithm may
        program parameters and adapt them per ISO band or manual overrides.

        Reported in metadata as a boolean.

  - DpfChannelStrengths:
      type: int32_t
      direction: inout
      description: |
        Override filter strength for R,G,B channels. Values map to hardware
        strength registers (0..255 typical). Size must be exactly 3 when set.
        Order: R,G,B. If unset the tuning / ISO level derived strengths apply.
      size: [3]

  - DpfGreenSpatialCoefficients:
      type: int32_t
      direction: inout
      description: |
        Override 9x9 green spatial kernel coefficients (6 values). Order must
        follow tuning file convention. Each value 0..63 typical. All 6 required
        when provided; otherwise ignored.
      size: [6]

  - DpfRedBlueSpatialCoefficients:
      type: int32_t
      direction: inout
      description: |
        Override Red/Blue spatial kernel coefficients (6 values). Applies to
        either 9x9 or 13x9 depending on DpfRbFilterSize. For 9x9 the last
        column pair is dropped in hardware. Values 0..63 typical.
      size: [6]

  - DpfRbFilterSize:
      type: int32_t
      direction: inout
      description: |
        Override RB spatial filter size selection.
      enum:
        - name: DpfRbFilterSize9x9
          value: 0
          description: Use 9x9 RB domain filter.
        - name: DpfRbFilterSize13x9
          value: 1
          description: Use 13x9 RB domain filter (if coefficients valid).

  - DpfNoiseLevelLookupCoefficients:
      type: int32_t
      direction: inout
      description: |
        Override Noise Level Lookup (NLL) piecewise-linear coefficients
        (17 values). Must supply full set when used or override is ignored.
      size: [17]

  - DpfNoiseLevelLookupScaleMode:
      type: int32_t
      direction: inout
      description: |
        Override NLL scale mode (0=linear,1=logarithmic). Matches hardware
        RKISP1_CIF_ISP_NLL_SCALE_* constants.
      enum:
        - name: DpfNoiseLevelLookupScaleLinear
          value: 0
          description: Linear scale.
        - name: DpfNoiseLevelLookupScaleLogarithmic
          value: 1
          description: Logarithmic scale.
  - DpfMode:
      type: int32_t
      direction: inout
      description: |
        Controls the operating mode of the Denoise Pre-Filter (DPF) algorithm.

        In Auto mode the algorithm selects parameters automatically from the
        sensor tuning data and (if provided) the ISO level table. Changes in
        scene brightness (analogue gain / ISO) may cause the algorithm to
        re-evaluate and reprogram the hardware when an ISO band boundary is
        crossed.

        In Manual mode the automatically selected parameters are frozen at
        the moment the mode switch occurs (a snapshot is taken). Subsequent
        per‑frame automatic ISO/tuning updates are disabled until the mode is
        set back to Auto. While in Manual mode the application may modify any
        of the override controls (e.g. DpfChannelStrengths, DpfGreenSpatialCoefficients,
        DpfRedBlueSpatialCoefficients, DpfRbFilterSize, DpfNoiseLevelLookupCoefficients,
        DpfNoiseLevelLookupScaleMode). Changes are applied immediately to hardware.

        Transition Rules:
          * Auto -> Manual: The current effective (auto-selected) parameters
            are captured as the initial manual override values.
          * Manual -> Auto: All manual override state is discarded and the
            algorithm immediately reverts to automatic tuning selection,
            potentially reprogramming hardware that same frame.

        If the application switches to Manual but supplies no overrides,
        the previously auto-derived parameters continue to be used unchanged.

        \\sa DpfEnable
        \\sa DpfChannelStrengths
      enum:
        - name: DpfModeAuto
          value: 0
          description: Automatic mode - algorithm selects parameters based on tuning data.
        - name: DpfModeManual
          value: 1
          description: Manual mode - parameters are frozen and can be overridden.

...
