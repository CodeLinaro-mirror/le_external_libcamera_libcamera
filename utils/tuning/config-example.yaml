general:
  disable: []
  plot: []
  alsc:
    do_alsc_colour: 1
    luminance_strength: 0.5
  awb:
    # Algorithm can be either 'grey' or 'bayes'
    algorithm: bayes
    # priors is only used for the bayes algorithm
    priors:
      - lux: 0
        ct: [ 2000, 13000]
        probability: [ 1.0, 1.0 ]
    AwbMode:
      AwbAuto:
        lo: 2500
        hi: 8000
      AwbIncandescent:
        lo: 2500
        hi: 3000
      AwbTungsten:
        lo: 3000
        hi: 3500
      AwbFluorescent:
        lo: 4000
        hi: 4700
      AwbIndoor:
        lo: 3000
        hi: 5000
      AwbDaylight:
        lo: 5500
        hi: 6500
      AwbCloudy:
        lo: 6500
        hi: 8000
      # One custom mode can be defined if needed
      #AwbCustom:
      #  lo: 2000
      #  hi: 1300
  macbeth:
    small: 1
    show: 0
